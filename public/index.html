
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Data | Node.js</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px 20px;
      color: #1f2937;
    }

    main {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
    }

    h1 { color: #2563eb; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #2563eb;
      color: white;
    }

    tr:hover { background: #eff6ff; }
  </style>
</head>
<body>
  <main>
    <h1>Student Data</h1>
    <p>This webpage is served using Node.js.</p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Course</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Ananya</td><td>Data Science</td><td>92</td></tr>
        <tr><td>2</td><td>Rahul</td><td>Cybersecurity</td><td>85</td></tr>
        <tr><td>3</td><td>Meera</td><td>AI & ML</td><td>89</td></tr>
        <tr><td>4</td><td>Arjun</td><td>Web Development</td><td>78</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
